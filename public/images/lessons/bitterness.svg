<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">المرارة (Bitterness)</title><desc id="desc">وصف حسي ← مصادر متعددة ← ليس تشخيصًا منفردًا. رسم تعليمي توضيحي.</desc><rect width="1200" height="630" fill="#F5F2E9"/><g fill="#2F2F2F" font-family="Arial, sans-serif"><text x="80" y="60" font-size="18" letter-spacing="3">GOAT JOURNEY / ACADEMY</text><text x="1120" y="110" text-anchor="start" direction="rtl" font-size="34" font-weight="bold">المرارة (Bitterness)</text><circle cx="250" cy="300" r="100" fill="#F5DB30"/><path d="M170 245q40-15 80 15q40-30 80-15v120q-40-15-80 15q-40-30-80-15zM250 260v120" fill="white" stroke="#2F2F2F" stroke-width="5"/><rect x="490" y="198" width="625" height="68" rx="17" fill="#E8E7E1"/><text x="1060" y="242" text-anchor="start" direction="rtl" font-size="27">وصف حسي</text><circle cx="1100" cy="232" r="12" fill="#2F2F2F"/><rect x="490" y="287" width="625" height="68" rx="17" fill="#A9AAA5"/><text x="1060" y="331" text-anchor="start" direction="rtl" font-size="27">مصادر متعددة</text><circle cx="1100" cy="321" r="12" fill="#2F2F2F"/><rect x="490" y="376" width="625" height="68" rx="17" fill="#F5DB30"/><text x="1060" y="420" text-anchor="start" direction="rtl" font-size="27">ليس تشخيصًا منفردًا</text><circle cx="1100" cy="410" r="12" fill="#2F2F2F"/><path d="M80 510h1040" stroke="#A9AAA5"/><text x="1120" y="560" text-anchor="start" direction="rtl" font-size="22">لغة التذوق · تعلّم، جرّب، وسجّل النتيجة</text><text x="80" y="600" font-size="16">bitterness</text></g></svg>